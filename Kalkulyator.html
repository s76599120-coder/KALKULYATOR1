<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulyator</title>
<style>
:root{
  --bg1:#eef1ff;--bg2:#fbe9f4;--card:rgba(255,255,255,.65);--border:rgba(255,255,255,.8);
  --text:#161a2e;--muted:#6b7190;--key:rgba(255,255,255,.85);--key-h:#fff;
  --fn:rgba(120,130,170,.16);--op:#6c5ce7;--op2:#a29bfe;--eq1:#ff7a59;--eq2:#ff4d8d;
  --danger:#e5384f;--shadow:0 30px 80px rgba(80,70,160,.25);--ks:0 4px 12px rgba(60,60,120,.1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg1:#0b0d1a;--bg2:#1a1030;--card:rgba(28,30,52,.7);--border:rgba(255,255,255,.08);
  --text:#f2f3ff;--muted:#8d92b5;--key:rgba(255,255,255,.07);--key-h:rgba(255,255,255,.13);
  --fn:rgba(255,255,255,.13);--op:#7c6cff;--op2:#4fc3ff;--eq1:#ff8a5c;--eq2:#ff3d8b;
  --danger:#ff6b7d;--shadow:0 30px 80px rgba(0,0,0,.6);--ks:0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);
  background:radial-gradient(circle at 15% 10%,var(--bg2),transparent 55%),radial-gradient(circle at 85% 90%,var(--op2),transparent 60%),var(--bg1);
  background-attachment:fixed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;transition:background .4s}
.wrap{display:flex;gap:20px;width:100%;max-width:820px;align-items:stretch;justify-content:center}
.panel{background:var(--card);border:1px solid var(--border);border-radius:32px;box-shadow:var(--shadow);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:20px}
.calc{flex:0 0 380px;max-width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-weight:700;letter-spacing:.5px;font-size:14px;color:var(--muted)}
.tools{display:flex;gap:8px}
.ico{width:40px;height:40px;border-radius:14px;border:1px solid var(--border);background:var(--key);color:var(--text);
  font-size:18px;cursor:pointer;transition:transform .15s,background .2s}
.ico:hover{background:var(--key-h)}.ico:active{transform:scale(.88)}
.hist-btn{display:none}
.screen{text-align:right;padding:10px 6px 18px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{min-height:22px;color:var(--muted);font-size:16px;word-break:break-all}
.out{font-weight:600;font-size:56px;line-height:1.1;white-space:nowrap;overflow:hidden;transition:font-size .15s;font-variant-numeric:tabular-nums}
.out.m{font-size:42px}.out.s{font-size:32px}.out.xs{font-size:24px}
.out.err{color:var(--danger);font-size:24px;white-space:normal;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:64px;gap:12px}
button.k{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:22px;background:var(--key);color:var(--text);
  font:500 22px inherit;font-family:inherit;cursor:pointer;box-shadow:var(--ks);transition:transform .12s,background .2s,box-shadow .2s;user-select:none}
button.k:hover{background:var(--key-h)}
button.k:active,button.k.press{transform:scale(.9);box-shadow:none}
button.fn{background:var(--fn);font-size:19px}
button.op{background:linear-gradient(135deg,var(--op),var(--op2));color:#fff;border:none;font-size:26px}
button.op:hover{filter:brightness(1.1)}
button.eq{background:linear-gradient(160deg,var(--eq1),var(--eq2));color:#fff;border:none;grid-row:span 2;font-size:30px;box-shadow:0 8px 22px rgba(255,77,141,.4)}
button.op.active{outline:3px solid rgba(255,255,255,.7);filter:brightness(1.15)}
button.z{grid-column:span 2}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.hint{margin-top:12px;text-align:center;font-size:11px;color:var(--muted)}
.hist{flex:1;min-width:0;display:flex;flex-direction:column;max-height:760px}
.hist h3{margin:0;font-size:16px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.clr{border:none;background:var(--fn);color:var(--danger);font:600 13px inherit;font-family:inherit;padding:8px 12px;border-radius:12px;cursor:pointer;transition:transform .12s}
.clr:active{transform:scale(.92)}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.item{padding:12px 14px;border-radius:16px;background:var(--key);border:1px solid var(--border);text-align:right;cursor:pointer;animation:in .3s ease;transition:background .2s}
.item:hover{background:var(--key-h)}
.item small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.item b{font-size:20px;font-weight:600}
.empty{color:var(--muted);text-align:center;margin-top:30px;font-size:14px}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:760px){
  body{padding:10px;align-items:flex-start}
  .calc{flex:1 1 100%}
  .hist-btn{display:inline-block}
  .hist{position:fixed;left:10px;right:10px;bottom:10px;top:auto;max-height:65vh;z-index:5;transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .hist.open{transform:none}
  .pad{grid-auto-rows:clamp(54px,9vh,64px);gap:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel calc">
    <div class="top">
      <span class="brand">KALKULYATOR</span>
      <div class="tools">
        <button class="ico hist-btn" id="hbtn" title="Tarix">🕘</button>
        <button class="ico" id="theme" title="Mavzu">🌙</button>
      </div>
    </div>
    <div class="screen"><div class="expr" id="expr"></div><div class="out" id="out">0</div></div>
    <div class="pad" id="pad">
      <button class="k fn" data-id="AC">AC</button>
      <button class="k fn" data-id="neg">+/−</button>
      <button class="k fn" data-id="pct">%</button>
      <button class="k op" data-id="/">÷</button>
      <button class="k fn" data-id="sqrt">√</button>
      <button class="k fn" data-id="sq">x²</button>
      <button class="k fn" data-id="del">DEL</button>
      <button class="k op" data-id="*">×</button>
      <button class="k" data-id="7">7</button><button class="k" data-id="8">8</button><button class="k" data-id="9">9</button>
      <button class="k op" data-id="-">−</button>
      <button class="k" data-id="4">4</button><button class="k" data-id="5">5</button><button class="k" data-id="6">6</button>
      <button class="k op" data-id="+">+</button>
      <button class="k" data-id="1">1</button><button class="k" data-id="2">2</button><button class="k" data-id="3">3</button>
      <button class="k eq" data-id="=">=</button>
      <button class="k z" data-id="0">0</button>
      <button class="k" data-id=".">,</button>
    </div>
    <div class="hint">Klaviatura: 0-9 · . , · + − * / · Enter · Backspace · Esc · % · R (√) · S (x²) · N (±)</div>
  </div>
  <div class="panel hist" id="hist">
    <div class="hh"><h3>Hisoblash tarixi</h3><button class="clr" id="hclr">Tozalash</button></div>
    <div class="list" id="list"></div>
  </div>
</div>
<script>
(function(){
  var SYM={'+':'+','-':'−','*':'×','/':'÷'};
  var cur='0',prev=null,op=null,awaiting=false,justEq=false,err=null,lastOp=null,lastB=null,expr='',history=[];
  var $=function(i){return document.getElementById(i)};
  var out=$('out'),exprEl=$('expr'),list=$('list');

  function clean(n){return parseFloat(n.toPrecision(12))}
  function str(n){
    if(!isFinite(n)) throw new Error("Natija juda katta");
    return String(clean(n));
  }
  function fmt(s){
    s=String(s);
    if(/e/i.test(s)) return s.replace('.',',').replace('e+','e');
    var neg=s[0]==='-'; if(neg) s=s.slice(1);
    var p=s.split('.'), ip=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
    return (neg?'-':'')+ip+(p.length>1?','+p[1]:'');
  }
  function calc(a,o,b){
    switch(o){
      case '+':return clean(a+b);
      case '-':return clean(a-b);
      case '*':return clean(a*b);
      case '/':if(b===0) throw new Error("0 ga bo‘lish mumkin emas"); return clean(a/b);
    }
  }
  function pushHist(e,r){
    history.unshift({e:e,r:r}); if(history.length>50) history.pop();
    saveHist(); renderHist();
  }
  function fail(msg){err=msg;prev=null;op=null;awaiting=false;justEq=false;expr='';render()}
  function resetIfNeeded(){
    if(err){cur='0';err=null;expr='';prev=null;op=null;awaiting=false;justEq=false}
    if(justEq){cur='0';expr='';prev=null;op=null;justEq=false;lastOp=null}
  }
  function digit(d){
    resetIfNeeded();
    if(awaiting){cur='0';awaiting=false}
    if(cur==='0') cur=d; else if(cur==='-0') cur='-'+d;
    else if(cur.replace(/[-.]/g,'').length<15) cur+=d;
    render();
  }
  function dot(){
    resetIfNeeded();
    if(awaiting){cur='0';awaiting=false}
    if(cur.indexOf('.')<0) cur+='.';
    render();
  }
  function setOp(o){
    if(err) return;
    try{
      if(op!==null&&!awaiting){
        var b=parseFloat(cur),r=calc(prev,op,b);
        pushHist(fmt(prev)+' '+SYM[op]+' '+fmt(b),str(r));
        prev=r;cur=str(r);
      }else if(op===null){prev=parseFloat(cur)}
    }catch(e){return fail(e.message)}
    op=o;awaiting=true;justEq=false;lastOp=null;
    expr=fmt(str(prev))+' '+SYM[o];
    render();
  }
  function equals(){
    if(err) return;
    try{
      var a,b,o;
      if(op!==null){a=prev;o=op;b=parseFloat(cur);
        expr=fmt(str(a))+' '+SYM[o]+' '+fmt(str(b))+' =';
      }else if(justEq&&lastOp){a=parseFloat(cur);o=lastOp;b=lastB;
        expr=fmt(str(a))+' '+SYM[o]+' '+fmt(str(b))+' =';
      }else return;
      var r=calc(a,o,b);
      pushHist(expr.slice(0,-2),str(r));
      lastOp=o;lastB=b;prev=null;op=null;cur=str(r);justEq=true;awaiting=false;
    }catch(e){return fail(e.message)}
    render();
  }
  function unary(kind){
    if(err) return;
    var x=parseFloat(cur),r,label;
    try{
      if(kind==='sqrt'){
        if(x<0) throw new Error("Manfiy sondan ildiz olib bo‘lmaydi");
        r=clean(Math.sqrt(x));label='√('+fmt(str(x))+')';
      }else if(kind==='sq'){
        r=clean(x*x);label='('+fmt(str(x))+')²';
      }else{
        if(op!==null&&!awaiting){
          r=(op==='+'||op==='-')?clean(prev*x/100):clean(x/100);
          label=fmt(str(x))+'%';
          cur=str(r);render();return;
        }
        r=clean(x/100);label=fmt(str(x))+'%';
      }
      var s=str(r);
      pushHist(label,s);
      cur=s;expr=label+' =';
      if(awaiting){awaiting=false}
      else if(op===null){justEq=true;lastOp=null}
    }catch(e){return fail(e.message)}
    render();
  }
  function negate(){
    if(err) return;
    if(justEq){justEq=false;expr='';lastOp=null}
    awaiting=false;
    if(cur!=='0'){cur=cur[0]==='-'?cur.slice(1):'-'+cur}
    render();
  }
  function del(){
    if(err){return clear()}
    if(justEq||awaiting) return;
    cur=cur.slice(0,-1);
    if(cur===''||cur==='-') cur='0';
    render();
  }
  function clear(){cur='0';prev=null;op=null;awaiting=false;justEq=false;err=null;lastOp=null;lastB=null;expr='';render()}

  function render(){
    if(err){out.textContent=err;out.className='out err'}
    else{
      var t=fmt(cur);out.textContent=t;
      var n=t.length;out.className='out'+(n>16?' xs':n>12?' s':n>8?' m':'');
    }
    exprEl.textContent=expr;
    document.querySelectorAll('button.op').forEach(function(b){
      b.classList.toggle('active',awaiting&&b.dataset.id===op);
    });
  }
  function renderHist(){
    list.innerHTML='';
    if(!history.length){var d=document.createElement('div');d.className='empty';d.textContent='Tarix hozircha bo‘sh';list.appendChild(d);return}
    history.forEach(function(h){
      var d=document.createElement('div');d.className='item';
      var s=document.createElement('small');s.textContent=h.e+' =';
      var b=document.createElement('b');b.textContent=fmt(h.r);
      d.appendChild(s);d.appendChild(b);
      d.onclick=function(){
        resetIfNeeded();cur=h.r;awaiting=false;justEq=op===null;expr='';render();
        $('hist').classList.remove('open');
      };
      list.appendChild(d);
    });
  }
  function saveHist(){try{localStorage.setItem('calc-hist',JSON.stringify(history))}catch(e){}}
  function loadHist(){try{var v=JSON.parse(localStorage.getItem('calc-hist')||'[]');if(Array.isArray(v)) history=v.slice(0,50)}catch(e){}}

  function act(id){
    if(/^\d$/.test(id)) digit(id);
    else if('+-*/'.indexOf(id)>=0&&id.length===1) setOp(id);
    else switch(id){
      case '.':dot();break;case '=':equals();break;case 'AC':clear();break;
      case 'del':del();break;case 'neg':negate();break;
      case 'pct':unary('pct');break;case 'sqrt':unary('sqrt');break;case 'sq':unary('sq');break;
    }
  }
  // clicks + ripple
  $('pad').addEventListener('pointerdown',function(e){
    var b=e.target.closest('button.k');if(!b) return;
    var r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/4,sp=document.createElement('span');
    sp.className='rip';sp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
    b.appendChild(sp);setTimeout(function(){sp.remove()},600);
  });
  $('pad').addEventListener('click',function(e){
    var b=e.target.closest('button.k');if(b) act(b.dataset.id);
  });
  // keyboard
  var KEYS={',':'.','x':'*','X':'*','Enter':'=','Backspace':'del','Delete':'AC','Escape':'AC','%':'pct','r':'sqrt','R':'sqrt','s':'sq','S':'sq','n':'neg','N':'neg'};
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var k=e.key,id=KEYS[k]||k;
    if(!/^(\d|[-+*\/.=]|AC|del|neg|pct|sqrt|sq)$/.test(id)) return;
    e.preventDefault();
    if(document.activeElement&&document.activeElement.tagName==='BUTTON') document.activeElement.blur();
    var b=document.querySelector('button.k[data-id="'+(id==='.'?'.':id)+'"]');
    if(b){b.classList.add('press');setTimeout(function(){b.classList.remove('press')},120)}
    act(id);
  });
  // theme
  function setTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    $('theme').textContent=t==='dark'?'☀️':'🌙';
    try{localStorage.setItem('calc-theme',t)}catch(e){}
  }
  var saved=null;try{saved=localStorage.getItem('calc-theme')}catch(e){}
  setTheme(saved||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  $('theme').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')};
  $('hbtn').onclick=function(){$('hist').classList.toggle('open')};
  $('hclr').onclick=function(){history=[];saveHist();renderHist()};
  loadHist();renderHist();render();
})();
</script>
</body>
</html>
